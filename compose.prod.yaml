name: myapp-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - public-assets:/shared-public
    command: sh -c "cp -r /var/www/html/public/. /shared-public/ && php-fpm"
    depends_on:
      pgsql:
        condition: service_healthy
    networks: [prodnet]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public-assets:/var/www/html/public:ro
    depends_on:
      - app
    networks: [prodnet]

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prod-pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      retries: 5
    networks: [prodnet]

volumes:
  prod-pgsql-data:
  public-assets:

networks:
  prodnet:
    driver: bridge
